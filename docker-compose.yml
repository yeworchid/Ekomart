services:
  postgres:
    image: postgres:15
    container_name: ekomart_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ekomart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ekomart"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: ekomart_mongo
    restart: always
    environment:
      MONGO_INITDB_DATABASE: ekomart_technical
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  seeder:
    build:
      context: .
      dockerfile: Dockerfile
      target: seeder
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=ekomart;Username=postgres;Password=postgres
      ConnectionStrings__Mongo: mongodb://mongo:27017
      Mongo__DatabaseName: ekomart_technical
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: ekomart_web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      seeder:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=ekomart;Username=postgres;Password=postgres
      ConnectionStrings__Mongo: mongodb://mongo:27017
      Mongo__DatabaseName: ekomart_technical
    ports:
      - "5016:8080"

volumes:
  postgres_data:
  mongo_data:
